<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codefield for LeetCode</title><link rel="stylesheet" href="src/editor.css"><link rel="stylesheet" href="panel.css"></head>
<body><header><strong>⌘ &nbsp;Codefield</strong><span>LeetCode</span></header>
<main><h1 id="title">Open a LeetCode problem</h1><p id="notice" role="status"></p>
<div id="workspace" hidden>
<nav aria-label="Editor controls"><select id="language" aria-label="Editor language"></select><button id="pull" title="Read the current LeetCode editor">Import draft</button><button id="push" title="Write this draft into the LeetCode editor">Send to LeetCode</button><button id="copy">Copy code</button></nav>
<section aria-label="Solution"><div id="editor"></div></section>
<section class="trace"><div class="bar"><h2>Live trace</h2><label><input type="checkbox" id="auto" checked> Auto-run</label></div>
<div class="bar"><select id="example" aria-label="Example to trace"></select><button id="remote" hidden>Enable online runner</button></div>
<details id="custom"><summary>Example inputs</summary><label>Function name<input id="fn" spellcheck="false"></label><label>Arguments as a JSON array<textarea rows="2" id="args" spellcheck="false"></textarea></label></details>
<pre id="verdict" role="status"></pre><div id="replay" hidden><div class="bar"><button id="play" aria-label="Play trace">▶</button><button id="prev" aria-label="Previous trace step">←</button><input type="range" id="step" min="1" value="1" aria-label="Execution step"><button id="next" aria-label="Next trace step">→</button></div><button id="line" title="Select this line in the editor"></button><pre id="locals"></pre></div>
<details id="console" hidden><summary>Console output</summary><pre></pre></details></section></div></main>
<iframe id="runner" title="Isolated code runner" hidden></iframe><script type="module" src="panel.js"></script></body></html>
